name: Lint

# Pyflakes rules with ruff (see ruff.toml): undefined names, unused imports,
# broken format strings... Run it locally with: uvx ruff@0.17.1 check .
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: ruff check
        run: uvx ruff@0.17.1 check --output-format github .
