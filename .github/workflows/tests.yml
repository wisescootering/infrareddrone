name: Tests

# Runs the unit tests on Linux and Windows, with Python 3.9 (the version of the
# Windows conda environment, environment.yml) and 3.12 (the default of setup.sh),
# so that code working only on one machine or one Python version is caught.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: setup-python has no Python 3.9 for Ubuntu 26.04.
        os: [ubuntu-24.04, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      # config.py creates the working folder: keep it inside the runner.
      IRDRONE_WORKING_DIR: ${{ github.workspace }}/Air-Mission
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # Libraries Qt needs to start, even offscreen, plus ExifTool.
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libimage-exiftool-perl

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
