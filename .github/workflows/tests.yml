name: Tests

# Runs the unit tests on Linux and Windows, with Python 3.9 (the oldest version
# still in use) and 3.12 (the default of setup.sh and of the Docker image),
# so that code working only on one machine or one Python version is caught.
# uv provides both Python versions (setup-python no longer ships 3.9).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      # config.py creates the working folder: keep it inside the runner.
      IRDRONE_WORKING_DIR: ${{ github.workspace }}/Air-Mission
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          cache-dependency-glob: requirements.txt

      # Libraries Qt needs to start, even offscreen, plus ExifTool.
      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libimage-exiftool-perl

      - name: Install Python packages
        run: uv pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v
