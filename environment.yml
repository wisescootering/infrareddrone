# Optional conda environment, an alternative to the .venv of setup.sh / install.bat.
# Its advantage: GDAL from conda-forge, used for the contour lines of the maps (step 5).
#
#   conda env create -f environment.yml        (or mamba / micromamba)
#   conda env update -f environment.yml        to update it
#
# The launchers (irdrone_wizard.bat / .sh) find it by its name, see IRDRONE_CONDA_ENV.
# The Python packages come from requirements.txt, the single list for every setup.
name: irdrone
channels:
  - conda-forge
dependencies:
  - python=3.12
  - gdal
  - pip
  - pip:
      - -r requirements.txt
