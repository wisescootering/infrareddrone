# Test runner: python -m pytest   (pip / uv install -r requirements-dev.txt)
# Only tests/ is collected: synchronization/test/ holds a standalone experiment.
[pytest]
testpaths = tests
addopts = -ra
filterwarnings =
    # process.show calls plt.show(), harmless with the headless Agg backend
    ignore:FigureCanvasAgg is non-interactive:UserWarning
