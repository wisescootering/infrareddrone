# GitHub Pages site. Sources are generated by prepare.py from the repository docs:
#   python website/prepare.py && mkdocs serve -f website/mkdocs.yml
site_name: IRDrone
site_description: Infrared & visible aerial photography with a DJI drone and an NIR camera
site_url: https://wisescootering.github.io/infrareddrone/
repo_url: https://github.com/wisescootering/infrareddrone
repo_name: wisescootering/infrareddrone
edit_uri: ""
docs_dir: build/src
site_dir: build/site

nav:
  - Home: index.md
  - Camera calibration: calibration.md
  - ODM mapping: odm-mapping.md
  - IGN registration: ign-registration.md
  - User manual (PDF): https://github.com/wisescootering/infrareddrone/releases/download/help-latest/irdrone_help.pdf

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.superfences
  - pymdownx.highlight
